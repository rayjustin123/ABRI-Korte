<style>
/* Layout: phone-first schedule column with a bottom tab bar; tapping an open hour slides a booking sheet up.
   From 960px the booking sheet docks as a sticky right column and the tabs move into the top bar.
   Headings are set in Poppins like the ABRI KORTE logo: a heavier word, then a lighter, wider-spaced one. */
:root{
  --bg:#F5F0EA;--surface:#FFFFFF;--sunk:#EFE8DE;--ink:#1B242D;--ink-2:#4B5865;--ink-3:#5F6C79;--line:#E2D9CD;
  --azure:#028FD6;--azure-soft:#DDEFFA;--azure-ink:#005E92;
  --dusk-soft:#E4E8F0;--dusk-ink:#22374F;
  --gold:#F2B233;--gold-soft:#FBEFD2;--gold-ink:#7A5200;
  --clay:#AA442D;--clay-soft:#F4E2DC;--clay-ink:#8C3523;
  --pill:#0170AD;--pill-ink:#FFFFFF;--tag:#FFFFFF;
  --cta:#1B242D;--cta-ink:#F5F0EA;
  --band:#016FA8;--band-ink:#FFFFFF;--band-ink-2:rgba(255,255,255,.9);--band-chip:rgba(255,255,255,.14);--band-line:rgba(255,255,255,.34);--band-on:#FFFFFF;--band-on-ink:#1B242D;
  --shade:rgba(27,36,45,.45);
  --shadow:0 1px 2px rgba(27,36,45,.06),0 12px 32px rgba(27,36,45,.10);
  --font:"Barlow","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-brand:"Poppins","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0B1117;--surface:#121C25;--sunk:#18242F;--ink:#EFEAE2;--ink-2:#A9B6C1;--ink-3:#8796A3;--line:#24333F;
  --azure:#4CB8F3;--azure-soft:#0E2E45;--azure-ink:#9AD6F8;
  --dusk-soft:#1C2540;--dusk-ink:#B9C4E8;
  --gold:#F2B233;--gold-soft:#3A2E12;--gold-ink:#F7CB6E;
  --clay:#D56A51;--clay-soft:#3B1F18;--clay-ink:#F3AA95;
  --pill:#DDEB3F;--pill-ink:#10161C;--tag:#0B1117;
  --cta:#DDEB3F;--cta-ink:#10161C;
  --band:#08131D;--band-ink:#EFEAE2;--band-ink-2:#A9B6C1;--band-chip:#121C25;--band-line:#24333F;--band-on:#DDEB3F;--band-on-ink:#10161C;
  --shade:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:400 15px/1.5 var(--font);font-size-adjust:.53;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--band)}
html.lock,html.lock body{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);margin-top:24px}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;background:var(--band);color:var(--band-ink);box-shadow:0 0 0 100vmax var(--band);clip-path:inset(0 -100vmax)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
a.brand{text-decoration:none;color:inherit;border-radius:12px}
.chipmark{width:38px;height:38px;border-radius:10px;background:#F5F0EA;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.mark{width:27px;height:27px;flex:none}
.brand b{display:block;font:500 13px/1.25 var(--font-brand);letter-spacing:.3em}
.brand>div{min-width:0}
.brand>div>span{display:block;font-size:11px;color:var(--band-ink-2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toptabs{display:none;gap:4px;background:var(--band-chip);border:1px solid var(--band-line);border-radius:999px;padding:4px}
.toptabs a{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--band-ink-2);text-decoration:none;white-space:nowrap}
.toptabs a:hover{color:var(--band-ink)}
.toptabs a.on{background:var(--band-on);color:var(--band-on-ink)}
.topacts{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--band-line);background:var(--band-chip);color:var(--band-ink);display:grid;place-items:center;flex:none}
.themebtn svg{width:19px;height:19px}
.themebtn .moon,:root[data-theme="dark"] .themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .moon{display:block}

/* schedule header */
.hero{display:flex;flex-direction:column;gap:10px}
.lh{font:500 clamp(30px,8.4vw,46px)/1.05 var(--font-brand);font-size-adjust:none;text-transform:uppercase;letter-spacing:.05em;text-wrap:balance}
.lh .lt{font-weight:300;letter-spacing:.16em}
.promo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}

.weekbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px 10px;margin-inline:-4px;padding-inline:4px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.weeknav b{font-size:14px;font-weight:600}
.wk{display:flex;align-items:center;gap:10px;min-width:0}
.todaychip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink)}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.arrow:disabled{opacity:.35;cursor:default}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y}
.d{border:0;background:transparent;border-radius:16px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.d .dw{font-size:12px;color:var(--ink-3);font-weight:500}
.d .dd{font-size:18px;font-weight:600;line-height:1.2}
.d .load{width:22px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.d .load i{display:block;height:100%;background:var(--azure);border-radius:4px}
.d.today .dd{color:var(--azure-ink)}
.d.sel{background:var(--pill);color:var(--pill-ink)}
.d.sel .dw,.d.sel .dd{color:var(--pill-ink)}
.d.sel .load{background:rgba(127,127,127,.35)}
.d.sel .load i{background:var(--pill-ink)}
.d:disabled{opacity:.35;cursor:default}

.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.dayhead h2{font:500 17px/1.3 var(--font-brand)}
.dayhead span{font-size:13px;color:var(--ink-3)}

/* how to book, in three steps */
.how{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:0;font-size:14px;color:var(--ink-2)}
.how li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.how b{width:22px;height:22px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* the day, hour by hour: one button per hour you can start at */
.bands{display:flex;flex-direction:column;gap:22px}
.band{display:flex;flex-direction:column;gap:10px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.bt .ic{width:20px;height:20px}
.rt{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.br{font-size:13px;color:var(--ink-3);white-space:nowrap}
.hrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hr{min-height:54px;border:1px solid transparent;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;line-height:1.2;min-width:0}
.hr b{font-size:15px;font-weight:600;white-space:nowrap}
.hr span{font-size:11px;font-weight:500}
.hr.day{background:var(--azure-soft);color:var(--azure-ink)}
.hr.night{background:var(--dusk-soft);color:var(--dusk-ink)}
@media (hover:hover){button.hr:hover{border-color:currentColor}}
.hr.taken{background:var(--sunk);color:var(--ink-3);border-color:var(--line);background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(127,127,127,.1) 7px 14px)}
.hr.taken b{font-weight:500}
.hr.inr{box-shadow:inset 0 0 0 2px var(--pill)}
.hr.on{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.evt{grid-column:1/-1;border:0;border-radius:16px;padding:13px 15px 14px;background:var(--gold-soft);color:var(--gold-ink);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.evt b{font-size:16px;font-weight:600;color:var(--ink)}
.evt span:last-child{font-size:13px}
.qn{font-size:12px;color:var(--ink-3)}
.lateb{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;color:var(--ink)}
.lateb .ic{width:20px;height:20px;color:var(--dusk-ink);flex:none}
.lt1{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;font-weight:600;font-size:15px;line-height:1.3}
.lt1 small{font-size:12px;font-weight:400;color:var(--ink-3)}
.lt2{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);flex:none}
.lt2 svg{transition:transform .2s ease}
.band.late.open .lt2 svg{transform:rotate(180deg)}
@media (min-width:560px){.hrs{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* day list */
.list{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:start}
.when{padding-top:13px;display:flex;flex-direction:column}
.when b{font-size:14px;font-weight:600;white-space:nowrap}
.when span{font-size:12px;color:var(--ink-3)}
.card{width:100%;text-align:left;border:1px solid transparent;border-radius:20px;padding:13px 15px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
button.card{transition:transform .15s ease,border-color .15s ease}
button.card:active{transform:scale(.985)}
.card.day{background:var(--azure-soft);color:var(--azure-ink)}
.card.night{background:var(--dusk-soft);color:var(--dusk-ink)}
.card.event{background:var(--gold-soft);color:var(--gold-ink)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:inherit;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .ic{width:22px;height:22px;flex:none;opacity:.9}
.card-title{font-size:16px;font-weight:600;color:var(--ink)}
.card-sub{font-size:13px;color:inherit}
.foot{font-size:12px;color:var(--ink-3);padding-top:4px}

/* booking panel: bottom sheet on phones, docked column on desktop */
.shade{position:fixed;inset:0;background:var(--shade);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease}
.shade.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shadow);max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.pscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.panel.has-foot .pscroll{padding-bottom:18px}
.pfoot{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pfoot-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
.pfoot .sum{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;line-height:1.25}
.pfoot .sum span{font-size:12px;color:var(--ink-3)}
.pfoot .sum b{font:600 26px/1.1 var(--font-brand);font-size-adjust:none}
.pfoot .cta{width:auto;flex:none;padding:14px 18px}
.panel.open{transform:none}
.panel-in{display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 2px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ph h2{font:600 20px/1.2 var(--font-brand)}
.ph p{font-size:13px;color:var(--ink-3);margin-top:2px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ph p.pt{font-size:16px;font-weight:600;color:var(--ink);margin-top:4px}
.lens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:4px}
.ln{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:0}
.ln b{font-size:15px;font-weight:600;white-space:nowrap}
.ln span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.ln.on{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.ln.on span{color:var(--pill-ink);opacity:.85}
.ln i{position:absolute;top:-8px;right:-3px;background:var(--gold);color:#1B242D;border-radius:999px;padding:1px 6px;font:700 10px/1.4 var(--font);font-size-adjust:none;font-style:normal;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:70px;text-align:center;font-weight:600;font-size:15px;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 8px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.rent{display:flex;flex-direction:column;gap:10px}
.rent .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.rent .stepper output{min-width:88px}
.rent .row span{font-size:14px;min-width:0}
.rent .row small{display:block;font-size:12px;color:var(--ink-3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--azure)}
.txt{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.bill{background:var(--sunk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bill .l{display:flex;justify-content:space-between;gap:12px}
.bill .l span:first-child{color:var(--ink-2);min-width:0}
.bill .l.free span{color:var(--azure-ink)}
.bill .l.total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700;font-size:17px}
.bill .l.total span:first-child{color:var(--ink)}
.nudge{font-size:13px;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nudge button{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;flex:none}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--cta);color:var(--cta-ink);text-decoration:none;border:0;border-radius:999px;padding:15px 20px;font:700 16px/1 var(--font-cond);font-size-adjust:none;letter-spacing:.08em;text-transform:uppercase;width:100%}
.cta:hover{filter:brightness(1.06)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:500;font-size:15px;width:100%}
.fine{font-size:12px;color:var(--ink-3);text-align:center}
.msg{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;max-height:220px;overflow:auto;user-select:text;-webkit-user-select:text}
.done{display:flex;align-items:center;gap:12px}
.done .ok{width:40px;height:40px;border-radius:50%;background:var(--azure-soft);color:var(--azure-ink);display:grid;place-items:center;flex:none}
.empty{display:none}

/* rates + info */
.page{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{font:500 16px/1.3 var(--font-brand)}
.box p{font-size:14px;color:var(--ink-2)}
.ratecard{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.ratecard th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 4px}
.ratecard th:first-child,.ratecard td:first-child{text-align:left}
.ratecard td{padding:10px 4px;text-align:right;font:600 24px/1 var(--font-brand);font-size-adjust:none}
.ratecard td:first-child{font-family:var(--font);font-size-adjust:.53}
.cta svg{width:20px;height:20px;flex:none}
.ratecard td:first-child{font-weight:500;font-size:14px}
.ratecard td small{display:block;font-size:11px;font-weight:400;color:var(--ink-3)}
.pr{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-block:8px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0;padding-bottom:0}
.pr span:first-child{color:var(--ink-2)}
.pr b{font-weight:600}
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.rules li::marker{color:var(--ink-3);font-variant-numeric:tabular-nums}
.quietbox{background:var(--clay-soft);color:var(--clay-ink);border-radius:20px;padding:14px 18px}
.quietbox b{display:block;font-size:15px;font-weight:600}
.quietbox span{font-size:13px}
.links{display:flex;flex-direction:column;gap:8px}

/* tournament */
.tpage{gap:18px}
.thero{display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 12px/1.3 var(--font-brand);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.tblurb{font-size:15px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.thero .treg{max-width:380px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.soft{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.subseg{max-width:440px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.hint{font-size:13px;color:var(--ink-3)}
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;color:var(--ink);min-width:124px}
.dchip b{font-size:14px;font-weight:600}
.dchip span{font-size:12px;color:var(--ink-3)}
.dchip.on{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.dchip.on span{color:var(--pill-ink);opacity:.8}
.tblock{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.thead h2{font:500 18px/1.3 var(--font-brand)}
.thead>span{font-size:13px;color:var(--ink-3)}
.lvl{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lvl.b{color:var(--azure-ink)}
.lvl.n{color:var(--clay-ink)}
.ros{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3)}
.rcard h3{font:500 19px/1.3 var(--font-brand);margin:0}
.prz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.prz span{display:block;font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
.prz b{display:block;font-size:16px;font-weight:600}
.prz em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.fill{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--azure);border-radius:6px}
.rcard.n .bar i{background:var(--clay)}
.tlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.tlist li{overflow-wrap:anywhere}
.tlist li.open{color:var(--ink-3);font-style:italic}
.emptyt{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink-3)}
.pools2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pool{background:var(--sunk);border-radius:14px;padding:10px 12px;min-width:0}
.pool h4{font:600 12px/1.3 var(--font-brand);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 6px}
.qual{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card.game{background:var(--surface);border-color:var(--line);color:var(--ink-3)}
.card.game.ko{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}
.team{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink)}
.team span{min-width:0;overflow-wrap:anywhere}
.team.win{font-weight:600}
.team.tbd span{color:var(--ink-3);font-style:italic}
details.games{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:4px 14px}
details.games summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px}
details.games[open]{padding-bottom:14px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.place.p1{border-color:var(--gold)}
.place span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.place b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.place em{font-style:normal;font-size:12px;color:var(--ink-3)}
.stand{width:100%;border-collapse:collapse;font-size:13px}
.stand th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:4px}
.stand th:first-child,.stand td:first-child{text-align:left}
.stand td{padding:5px 4px;text-align:right;border-top:1px solid var(--line)}
.stand tr.q td:first-child{font-weight:600}
@media (min-width:720px){.ros,.qual{grid-template-columns:repeat(2,minmax(0,1fr))}.ros.one,.qual.one{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.podium{grid-template-columns:minmax(0,1fr)}}

/* standings: each pool's table with its games, then the knockout. In scorer mode the scores are typed into the games */
.scorer{background:var(--azure-soft);color:var(--azure-ink);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.scorer p{font-size:13px}
.scorer p b{display:block;font-size:15px;color:var(--ink)}
.stools{display:flex;flex-wrap:wrap;gap:8px}
.stools .cta{width:auto;padding:11px 18px;font-size:15px}
.stools .ghost{width:auto;padding:9px 14px;font-size:14px;border-radius:999px}
.ghost.warn{border-color:var(--clay);color:var(--clay-ink)}
.spools{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.spool{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sph{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sph h4{font:600 13px/1.3 var(--font-brand);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin:0}
.sph span{font-size:12px;color:var(--ink-3)}
.stand.st th:nth-child(2),.stand.st td:nth-child(2){text-align:left}
.stand.st td:first-child{width:22px;color:var(--ink-3)}
.stand.st tr.lead td:nth-child(2){font-weight:600}
.stand.st tr.q td{background:var(--gold-soft);color:var(--ink)}
.stand.st tr.q td:nth-child(2){font-weight:700}
.qt{display:inline-block;margin-left:6px;background:var(--gold);color:#1B242D;border-radius:5px;padding:0 6px;font:700 10px/1.6 var(--font);font-size-adjust:none;font-style:normal;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
.sgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sg{background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:7px 10px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sg.played{background:var(--surface);border-color:var(--line)}
.sg.ko{background:var(--gold-soft)}
.sgn{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sg.ko .sgn{color:var(--gold-ink)}
.sgr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;min-height:28px}
.sgr span{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.sgr b{font-weight:600;min-width:2ch;text-align:right}
.sgr.win{font-weight:600}
.sgr.tbd span{color:var(--ink-3);font-style:italic}
.si{width:46px;height:32px;flex:none;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);text-align:center;font-weight:600;font-size:16px;padding:0}
.si:focus{outline:2px solid var(--azure);outline-offset:0;border-color:var(--azure)}
.sg.tie .si{border-color:var(--clay)}
.sgw{font-size:12px;color:var(--clay-ink)}
.ssub{font:500 15px/1.3 var(--font-brand);margin-top:4px}
.sko{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
@media (min-width:640px){.spools{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* the board for a projector: pools down both sides, the road to the trophy in the middle.
   One font size follows the screen (1.08vw, or 1.95vh on wide screens) and everything is sized from it,
   so 16:9 and 4:3 screens both fit without scrolling. Always dark, whatever the page theme */
html.presenting,html.presenting body{overflow:hidden}
.board{--bd-font:"Barlow Condensed","Noto Sans","Roboto Condensed","Arial Narrow",system-ui,sans-serif;--bd-sky:#8CCEFF;--bd-dim:rgba(214,238,255,.62);--bd-edge:rgba(140,206,255,.24);
  position:fixed;inset:0;z-index:200;overflow:hidden;isolation:isolate;color:#FFFFFF;font-family:var(--bd-font);font-weight:600;font-size:min(1.08vw,1.95vh);line-height:1.2;font-size-adjust:none;
  background:radial-gradient(110% 90% at 50% 40%,#13408C 0%,#0B2257 36%,#08163A 62%,#050B1E 100%);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.6vh;padding:2.2vh 2.2vw 1.8vh}
.board::before,.board::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:24vw;height:24vw}
.board::before{left:0;top:0;background:linear-gradient(135deg,#1A86E0 0 7%,transparent 7% 9.5%,rgba(58,166,242,.5) 9.5% 12.5%,transparent 12.5% 14.5%,rgba(26,134,224,.22) 14.5% 16.5%,transparent 16.5%)}
.board::after{right:0;bottom:0;background:linear-gradient(315deg,#1A86E0 0 7%,transparent 7% 9.5%,rgba(58,166,242,.5) 9.5% 12.5%,transparent 12.5% 14.5%,rgba(26,134,224,.22) 14.5% 16.5%,transparent 16.5%)}
.bd-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2em}
.bd-brand{display:flex;align-items:center;gap:.8em;min-width:0}
.bd-brand svg{width:3.1em;height:3.1em;flex:none}
.bd-brand>div{min-width:0}
.bd-brand span{display:block;font:500 .82em/1.2 var(--font-brand);letter-spacing:.34em;color:var(--bd-sky);white-space:nowrap}
.bd-brand b{display:block;font-style:italic;font-weight:800;font-size:2.15em;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-title{display:flex;flex-direction:column;align-items:center;gap:.45em}
.bd-title b{font-style:italic;font-weight:800;font-size:2.3em;line-height:1;letter-spacing:.08em;text-transform:uppercase;padding:.26em 1.5em .3em;background:linear-gradient(90deg,#1A86E0,#3AA6F2 50%,#1A86E0);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);white-space:nowrap}
.bd-title span{font-size:.92em;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bd-sky);white-space:nowrap}
.bd-meta{justify-self:end;display:flex;align-items:center;gap:1.1em}
.bd-live{display:inline-flex;align-items:center;gap:.45em;font-size:.95em;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#FF8A77}
.bd-live i{width:.62em;height:.62em;border-radius:50%;background:#FF5A45;animation:bdpulse 1.8s ease-out infinite}
@keyframes bdpulse{0%{box-shadow:0 0 0 0 rgba(255,90,69,.6)}100%{box-shadow:0 0 0 .7em rgba(255,90,69,0)}}
.bd-clock{font-size:2em;font-weight:700}
.bd-ctl{display:flex;gap:.5em;transition:opacity .3s ease}
.bd-btn{border:1px solid rgba(140,206,255,.45);background:rgba(5,12,31,.55);color:#FFFFFF;border-radius:999px;padding:.5em 1.1em;font:700 .85em/1 var(--bd-font);letter-spacing:.14em;text-transform:uppercase}
.bd-btn:hover,.bd-btn.on,.bd-btn[aria-pressed="true"]{background:#1A86E0;border-color:#1A86E0}
.board.idle{cursor:none}
.board.idle .bd-ctl{opacity:0;pointer-events:none}
.bd-main{display:grid;grid-template-columns:minmax(0,32fr) minmax(0,36fr) minmax(0,32fr);gap:1.6vw;min-height:0}
.bd-main.bd-empty{grid-template-columns:minmax(0,1fr);place-items:center;font-size:1.6em;color:var(--bd-sky)}
.bd-side{display:flex;flex-direction:column;justify-content:center;gap:1.5vh;min-width:0;min-height:0}
.bd-p{background:linear-gradient(180deg,rgba(19,64,140,.55),rgba(8,22,58,.62));border:1px solid var(--bd-edge);border-radius:.9em;padding:.75em .95em .95em;display:flex;flex-direction:column;gap:.38em;min-width:0}
.bd-ph{display:flex;align-items:baseline;justify-content:space-between;gap:1em;margin-bottom:.1em}
.bd-ph b{font-style:italic;font-weight:800;font-size:1.75em;line-height:1;letter-spacing:.1em;text-transform:uppercase}
.bd-ph b em{font-style:inherit;color:#F2B233}
.bd-ph span{font-size:.9em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bd-sky)}
.bd-r{position:relative;isolation:isolate;display:grid;grid-template-columns:1.2em minmax(0,1fr) 1.7em 1.7em 2.3em 2.6em;align-items:center;column-gap:.45em;height:2.05em;padding:0 .8em 0 .95em;font-size:1.12em;font-variant-numeric:tabular-nums}
.bd-r>span{text-align:right}
.bd-r>span:nth-child(-n+2){text-align:left}
.bd-r::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);background:rgba(26,134,224,.16);border:1px solid rgba(140,206,255,.14);border-radius:.22em}
.bd-rh{height:1.25em}
.bd-rh::before{display:none}
.bd-rh>span{font-size:.62em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--bd-sky)}
.bd-r .rk{color:var(--bd-sky)}
.bd-r .nm{display:flex;align-items:center;gap:.45em;min-width:0;font-weight:700}
.bd-r .nm>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-r .w{font-weight:800}
.bd-r.lead::before{background:linear-gradient(90deg,rgba(26,134,224,.62),rgba(26,134,224,.2));border-color:rgba(140,206,255,.4)}
.bd-r.q::before{background:linear-gradient(90deg,#1A86E0,#3AA6F2);border-color:#BFE3FF}
.bd-r.q .rk{color:#FFFFFF}
.bd-q{flex:none;display:inline-block;background:#F2B233;color:#0B1533;font-style:normal;font-weight:800;font-size:.68em;line-height:1;padding:.24em .45em .22em;border-radius:.25em;letter-spacing:.1em;text-transform:uppercase}
.bd-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1vh;min-width:0;min-height:0}
.bd-cup{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.bd-cup::before{content:"";position:absolute;left:50%;top:-1.5em;width:15em;height:12em;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(242,178,51,.34),rgba(242,178,51,0));z-index:-1}
.bd-cup svg{height:min(5.4em,11.5vh);width:auto}
.bd-champl{margin-top:.15em;font-style:italic;font-weight:800;font-size:2.2em;line-height:1.05;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#FFF4C2 10%,#F7CD4E 48%,#C8921C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bd-champ{position:relative;isolation:isolate;margin-top:.35em;min-width:58%;max-width:100%;padding:.4em 1.6em;text-align:center;font-size:1.35em;font-weight:800;color:#0B1533}
.bd-champ::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);background:linear-gradient(90deg,#F7CD4E,#FFE38A 50%,#F2B233);border-radius:.22em}
.bd-champ.tbd{color:#F7CD4E;font-style:italic;font-weight:700}
.bd-champ.tbd::before{background:rgba(242,178,51,.1);border:1px dashed rgba(242,178,51,.6)}
.bd-champ span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-prize{margin-top:.5em;font-size:.95em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F7CD4E}
.bd-tree{width:100%;display:flex;flex-direction:column;align-items:center}
.bd-m{display:flex;flex-direction:column;gap:.32em;min-width:0}
.bd-ml{display:block;text-align:center;font-style:italic;font-weight:800;font-size:1.05em;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:var(--bd-sky);margin-bottom:.25em;white-space:nowrap}
.bd-ml small{font-size:.72em;font-style:normal;letter-spacing:.12em;color:var(--bd-dim);margin-left:.6em}
.bd-fin{width:60%}
.bd-fin .bd-ml{font-size:1.85em;color:#FFFFFF;letter-spacing:.16em}
.bd-fin .bd-ml small{font-size:.45em}
.bd-pl{position:relative;isolation:isolate;display:flex;align-items:center;gap:.45em;height:1.95em;padding:0 .3em 0 .9em;font-size:1.12em;font-weight:700;min-width:0}
.bd-pl::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);background:linear-gradient(90deg,#0E4FA8,#1A86E0);border:1px solid rgba(140,206,255,.45);border-radius:.22em}
.bd-pl .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-pl .sc{flex:none;min-width:1.9em;text-align:center;font-size:1.12em;font-weight:800}
.bd-fr{flex:none;font-style:normal;font-size:.68em;font-weight:800;line-height:1;color:#0B1533;background:var(--bd-sky);border-radius:.22em;padding:.24em .38em}
.bd-pl.tbd{color:var(--bd-dim);font-style:italic;font-weight:600}
.bd-pl.tbd::before{background:rgba(26,134,224,.1);border:1px dashed rgba(140,206,255,.38)}
.bd-pl.win::before{background:linear-gradient(90deg,#1A86E0,#3AA6F2);border-color:#BFE3FF}
.bd-pl.lose{color:rgba(255,255,255,.58)}
.bd-pl.lose::before{background:rgba(8,22,58,.8);border-color:rgba(140,206,255,.2)}

function liveModel() {

  T.config.cats.forEach(c => {

      if (!pools.length) { m.none[cid] = true; return; }

function weekLabel(w) {
  const a = W0 + 7 * w, b = a + 6, da = dateOf(a), db = dateOf(b);
  return da.getUTCMonth() === db.getUTCMonth() ? MO3[da.getUTCMonth()] + ' ' + da.getUTCDate() + ' to ' + db.getUTCDate() : MO3[da.getUTCMonth()] + ' ' + da.getUTCDate() + ' to ' + MO3[db.getUTCMonth()] + ' ' + db.getUTCDate();
}

function vBook() {
  const ws = W0 + 7 * S.week;
  const days = [...Array(7).keys()].map(i => ws + i);
  const strip = days.map(dn => {
    const past = dn < TODAY, sel = dn === S.day, today = dn === TODAY, d = dateOf(dn);
    const pct = Math.round(loadOf(dn) * 100);
    return '<button type="button" class="d' + (sel ? ' sel' : '') + (today ? ' today' : '') + '" data-act="day" data-dn="' + dn + '"' + (past ? ' disabled' : '') + ' aria-pressed="' + sel + '" aria-label="' + esc(longDate(dn)) + (today ? ', today' : '') + '">'
      + '<span class="dw">' + WD3[d.getUTCDay()] + '</span><span class="dd num">' + d.getUTCDate() + '</span><span class="load" aria-hidden="true"><i style="width:' + pct + '%"></i></span></button>';
  }).join('');
  const left = openHoursLeft(S.day);
  const list = bands(S.day) || '<div class="emptyt">Nothing left to book today. Pick another day above.</div>';
  const promo = D.promo && promoOn(TODAY) ? '<div class="promo"><span class="chip gold">3+1 promo</span><span>Book 4 hours and the 4th hour is free</span></div>' : '';
  const how = '<ol class="how"><li><b>1</b>Pick a day</li><li><b>2</b>Tap a start time</li><li><b>3</b>Send it on Messenger</li></ol>';
  const away = S.day !== TODAY;
  return '<section class="hero"><h1 class="lh">' + lockH('Book the court') + '</h1>' + how + promo + '</section>'
    + '<div class="weekbar"><div class="weeknav"><button type="button" class="arrow" data-act="week" data-v="-1" aria-label="Previous week"' + (S.week <= 0 ? ' disabled' : '') + '>' + I.left + '</button><span class="wk"><b class="num">' + weekLabel(S.week) + '</b>' + (away ? '<button type="button" class="todaychip" data-act="today">Today</button>' : '') + '</span><button type="button" class="arrow" data-act="week" data-v="1" aria-label="Next week"' + (S.week >= WEEKS - 1 ? ' disabled' : '') + '>' + I.right + '</button></div>'
    + '<div class="strip" id="strip">' + strip + '</div></div>'
    + '<div class="dayhead"><h2>' + esc(longDate(S.day)) + '</h2><span class="num">' + (left ? left + (left === 1 ? ' open hour' : ' open hours') : 'Fully booked') + '</span></div>'
    + '<div class="bands" id="list">' + list + '</div>'
    + '<p class="foot">Times are Philippine time. Schedule from our booking sheet, updated ' + esc(D.updatedLabel) + '. We confirm every booking by message.</p>';
}

/* the hours of one day in rate bands: late night (folded away unless opened), day, then night.
   The hour you picked is filled and the rest of your booking is outlined. */
function bands(dn) {
  const a = dn * DAY, r = rateSet(dn), cells = hourCells(dn);
  if (!cells.length) return '';
  const ds = a + D.rates.dayStart, de = a + D.rates.dayEnd;
  const p = S.pick && Math.floor(S.pick.s / DAY) === dn ? S.pick : null, end = p ? p.s + S.hours * 60 : 0;
  const cell = c => {
    if (c.kind === 'event') return '<button type="button" class="evt" data-act="tab" data-v="tournament"><span class="tag">Tournament</span><b>' + esc(c.label) + '</b><span>' + tshort(c.s) + ' to ' + tshort(c.e) + ' · Court closed to bookings · See the schedule</span></button>';
    const t = '<b class="num">' + tshort(c.s) + '</b>';
    if (c.kind === 'taken') return '<span class="hr taken">' + t + '<span>Taken</span></span>';
    const on = !!p && c.s === p.s, inr = !!p && c.s > p.s && c.s < end;
    return '<button type="button" class="hr ' + c.rate + (on ? ' on' : '') + (inr ? ' inr' : '') + '" data-act="pick" data-s="' + c.s + '" aria-pressed="' + on + '" aria-label="Start at ' + tfmt(c.s) + ', ' + peso(r[c.rate]) + ' an hour">' + t + (on ? '<span>Start</span>' : '') + '</button>';
  };
  const grid = list => '<div class="hrs">' + list.map(cell).join('') + '</div>';
  const head = (icon, name, price, from, to) => '<div class="bh"><span class="bt">' + icon + name + '<span class="rt num">' + peso(price) + '/hr</span></span><span class="br num">' + tshort(from) + ' to ' + tshort(to) + '</span></div>';
  const late = cells.filter(c => c.s < ds), day = cells.filter(c => c.s >= ds && c.s < de), night = cells.filter(c => c.s >= de);
  let html = '';
  if (late.length) {
    const open = S.late || (!!p && p.s < ds), n = late.filter(c => c.kind === 'open').length;
    html += '<section class="band late' + (open ? ' open' : '') + '"><button type="button" class="lateb" data-act="late" aria-expanded="' + open + '">' + I.moon
      + '<span class="lt1">Late night<small class="num">' + tshort(late[0].s) + ' to ' + tshort(ds) + ', right after ' + WD[dow(dn - 1)] + ' night · ' + peso(r.night) + '/hr</small></span>'
      + '<span class="lt2">' + (open ? 'Hide' : n + ' open') + I.down + '</span></button>' + (open ? grid(late) : '') + '</section>';
  }
  if (day.length) html += '<section class="band">' + head(I.sun, 'Day', r.day, day[0].s, de) + grid(day) + '</section>';
  if (night.length) html += '<section class="band">' + head(I.moon, 'Night', r.night, night[0].s, a + DAY) + grid(night)
    + (night[night.length - 1].s + 60 > a + D.quiet.from ? '<p class="qn">Quiet hours start at ' + tshort(D.quiet.from) + '. Please keep it low.</p>' : '') + '</section>';
  return html;
}

function messageText() {
  const p = S.pick; if (!p) return '';
  const h = S.hours, end = p.s + h * 60, q = quote(p.s, h, S.sport, S.paddles, S.balls);
  const endDay = Math.floor((end - 1) / DAY) !== Math.floor(p.s / DAY) ? ' the next day' : '';
  const lines = ['Hi Abri Korte! I would like to book the court.', '',
    'Date: ' + longDate(Math.floor(p.s / DAY)) + ', ' + dateOf(Math.floor(p.s / DAY)).getUTCFullYear(),
    'Time: ' + tfmt(p.s) + ' to ' + tfmt(end) + endDay + ' (' + h + (h === 1 ? ' hour' : ' hours') + ')',
    'Sport: ' + S.sport];
  if (S.sport === 'Pickleball' && (S.paddles || S.balls)) lines.push('Rentals: ' + [S.paddles ? S.paddles + (S.paddles === 1 ? ' paddle' : ' paddles') : '', S.balls ? S.balls + (S.balls === 1 ? ' ball' : ' balls') : ''].filter(Boolean).join(', '));
  if (S.sport === 'Badminton' && S.racquets) lines.push('Rentals: badminton racquets, please');
  if (S.name.trim()) lines.push('Name: ' + S.name.trim());
  lines.push('Estimated total: ' + peso(q.total) + (q.free ? ' (3+1 promo, ' + q.free + (q.free === 1 ? ' free hour)' : ' free hours)') : ''));
  lines.push('', 'Is this slot available?');
  return lines.join('\n');
}
const messengerUrl = () => D.messenger + '?text=' + encodeURIComponent(messageText());

function vPanel() {
  const p = S.pick;
  if (!p) {
    const r = D.rates;
    return '<div class="pscroll"><div class="panel-in"><div class="empty"><h2 style="font:600 18px/1.3 var(--font-brand)">Tap the hour you want to start</h2><p style="font-size:14px;color:var(--ink-2)">Pick a day, then tap an open hour. Choose how long you want to play, see the price, and send the booking to us on Messenger.</p>'

  }
  const dn = Math.floor(p.s / DAY);
  if (S.sent) {
    return '<div class="pscroll"><div class="panel-in"><div class="grab" aria-hidden="true"></div><div class="ph"><div class="done"><span class="ok">' + I.check + '</span><div><h2>Almost done</h2><p>Send the message in Messenger to book it.</p></div></div><button type="button" class="x" data-act="close" aria-label="Close">' + I.x + '</button></div>'
      + '<p style="font-size:14px;color:var(--ink-2)">' + (S.copied === true ? 'We copied your booking details. If Messenger opens with an empty message, paste them in and send.' : 'Copy your booking details below, then paste them in Messenger and send.') + ' Your slot is held once we reply to confirm.</p>'
      + '<div class="msg" id="msgbox">' + esc(messageText()) + '</div>'
      + '<button type="button" class="ghost" data-act="copy">Copy booking details</button>'
      + '<a class="cta" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener" data-act="open-msgr">' + I.chat + 'Open Messenger again</a>'
      + '<button type="button" class="ghost" data-act="reset">Book another time</button></div></div>';
  }
  const max = maxHours(p.s);
  if (S.hours > max) S.hours = Math.max(1, max);
  const h = S.hours, end = p.s + h * 60;
  const q = quote(p.s, h, S.sport, S.paddles, S.balls);
  const endsNext = Math.floor((end - 1) / DAY) !== dn;
  /* how long: one button per length that fits before the next booking, with its end time.
     With the 3+1 promo, the lengths that earn a free hour (4, 8) carry a badge */
  const lens = [...Array(max).keys()].map(i => {
    const n = i + 1, free = promoOn(dn) && n % D.promo.every === 0 ? n / D.promo.every : 0;
    return '<button type="button" class="ln' + (n === h ? ' on' : '') + '" data-act="len" data-v="' + n + '" aria-pressed="' + (n === h) + '"><b class="num">' + hrsTxt(n * 60) + '</b><span class="num">to ' + tshort(p.s + n * 60) + '</span>' + (free ? '<i>' + free + ' free</i>' : '') + '</button>';
  }).join('');
  const nb = nextStart(p.s);
  const limit = max < (D.maxHours || 8) && nb < Infinity ? '<span class="fine" style="text-align:left">The next booking starts at ' + tfmt(nb) + '.</span>' : '';
  const lines = [];
  if (q.dayH) lines.push(['Court, ' + q.dayH + (q.dayH === 1 ? ' day hr' : ' day hrs') + ' × ' + peso(q.r.day), peso(q.dayH * q.r.day)]);
  if (q.nightH) lines.push(['Court, ' + q.nightH + (q.nightH === 1 ? ' night hr' : ' night hrs') + ' × ' + peso(q.r.night), peso(q.nightH * q.r.night)]);
  if (q.free) lines.push(['3+1 promo, ' + q.free + (q.free === 1 ? ' free hr' : ' free hrs'), '−' + peso(q.freeVal), 'free']);
  if (q.rp) lines.push(['Paddles, ' + S.paddles + ' × ' + h + ' hrs × ' + peso(D.rentals.paddle), peso(q.rp)]);
  if (q.rb) lines.push(['Balls, ' + S.balls + ' × ' + h + ' hrs × ' + peso(D.rentals.ball), peso(q.rb)]);
  const nudge = promoOn(dn) && h % D.promo.every === D.promo.every - 1 && h + 1 <= max
    ? '<div class="nudge"><span>Add 1 more hour and it is free.</span><button type="button" data-act="hours" data-v="1">Add hour</button></div>' : '';
  const rentals = S.sport === 'Pickleball'
    ? '<div class="rent"><div class="row"><span>Paddles<small>' + peso(D.rentals.paddle) + ' each, per hour</small></span>' + stepper('paddles', S.paddles, 0, 8, S.paddles === 1 ? '1 paddle' : S.paddles + ' paddles') + '</div>'
      + '<div class="row"><span>Balls<small>' + peso(D.rentals.ball) + ' each, per hour</small></span>' + stepper('balls', S.balls, 0, 4, S.balls === 1 ? '1 ball' : S.balls + ' balls') + '</div></div>'
    : '<label class="switch" for="racq"><span>I need badminton racquets<small style="display:block;font-size:12px;color:var(--ink-3)">We will tell you the rental price when we confirm.</small></span><input type="checkbox" id="racq" data-act="racquets"' + (S.racquets ? ' checked' : '') + '></label>';
  return '<div class="pscroll"><div class="panel-in"><div class="grab" aria-hidden="true"></div>'
    + '<div class="ph"><div><h2>' + esc(shortDate(dn)) + '</h2><p class="pt num">' + tfmt(p.s) + ' to ' + tfmt(end) + (endsNext ? ' (' + WD3[dow(Math.floor(end / DAY))] + ')' : '') + '</p><p>' + (q.weekend ? 'Weekend rates' : 'Weekday rates') + '</p></div><button type="button" class="x" data-act="close" aria-label="Close">' + I.x + '</button></div>'
    + '<div class="field"><span class="flabel">How long</span><div class="lens" role="group" aria-label="How long">' + lens + '</div>' + limit + '</div>'
    + nudge

    + '<div class="field"><label for="name">Your name</label><input class="txt" id="name" data-bind="name" autocomplete="name" placeholder="So we can find your booking" value="' + esc(S.name) + '"></div>'
    + '<div class="field"><span class="flabel">Price</span><div class="bill" id="bill">' + lines.map(l => '<div class="l' + (l[2] ? ' ' + l[2] : '') + '"><span>' + l[0] + '</span><span class="num">' + l[1] + '</span></div>').join('') + '</div></div>'
    + '<p class="fine">We reply on Messenger to confirm. Pay in cash at the court or by GCash.</p></div></div>'

    + '<a class="cta" id="cta" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener" data-act="send">' + I.chat + 'Book on Messenger</a></div></div>';

function stepper(key, v, lo, hi, label) {
  return '<div class="stepper" role="group" aria-label="' + key + '"><button type="button" data-act="step" data-k="' + key + '" data-v="-1" aria-label="Less"' + (v <= lo ? ' disabled' : '') + '>−</button><output class="num" aria-live="polite">' + esc(label) + '</output><button type="button" data-act="step" data-k="' + key + '" data-v="1" aria-label="More"' + (v >= hi ? ' disabled' : '') + '>+</button></div>';
}

    + '<tr><td>Mon to Fri</td><td class="num">' + peso(r.weekday.day) + '</td><td class="num">' + peso(r.weekday.night) + '</td></tr>'
    + '<tr><td>Sat and Sun</td><td class="num">' + peso(r.weekend.day) + '</td><td class="num">' + peso(r.weekend.night) + '</td></tr></tbody></table>'
    + '<p>Day rate runs ' + tfmt(r.dayStart) + ' to ' + tfmt(r.dayEnd) + '. Every other hour is night rate. A booking that runs past midnight keeps its start day\'s rates.</p></div>'
    + (D.promo && promoOn(TODAY) ? '<div class="box" style="background:var(--gold-soft);border-color:transparent"><h2 style="color:var(--gold-ink)">3+1 promo</h2><p style="color:var(--gold-ink)">Every 4th court hour is free. Book 4 hours, pay for 3. ' + esc(ex) + '</p></div>' : '')
    + '<div class="box"><h2>Rentals</h2><div><div class="pr"><span>Paddle</span><b class="num">' + peso(D.rentals.paddle) + ' per hour</b></div><div class="pr"><span>Pickleball</span><b class="num">' + peso(D.rentals.ball) + ' per hour</b></div><div class="pr"><span>Badminton racquets</span><b>Ask us</b></div></div></div>'
    + '<div class="box"><h2>Drinks at the court</h2><div>' + D.drinks.map(x => '<div class="pr"><span>' + esc(x.name) + '</span><b class="num">' + peso(x.price) + '</b></div>').join('') + '</div></div>'
    + '<button type="button" class="cta" data-act="tab" data-v="book">' + I.cal + 'See open times</button></div>';
}

function vInfo() {
  return '<div class="page"><h1 class="lh">' + lockH('Court info') + '</h1>'
    + '<div class="box"><h2>Abri Korte</h2><p>' + esc(D.address) + '</p><p>Covered court for pickleball and badminton, open 24 hours.</p><div class="links"><a class="ghost" href="' + esc(D.maps) + '" target="_blank" rel="noopener">Open in Google Maps</a><a class="ghost" href="' + esc(D.fb) + '" target="_blank" rel="noopener">Our Facebook page</a><a class="ghost" href="' + esc(D.home || 'home/') + '">About Abri Korte</a></div></div>'
    + '<div class="quietbox"><b>Quiet hours, 10 PM to 5 AM</b><span>Please keep voices and music low. Our neighbors are sleeping.</span></div>'
    + '<div class="box"><h2>House rules</h2><ol class="rules">' + D.rules.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div></div>';
}

function tabbar() {
  const ic = { home: I.home, book: I.cal, tournament: I.trophy, rates: I.tagic, info: I.pin };
  return '<nav class="tabbar" aria-label="Main">' + NAV.map(([k, l]) => navLink(k, ic[k] + '<span>' + l + '</span>')).join('') + '</nav>';
}

/* ---------- theme: light first, a toggle for dark, the same saved choice as the home page ---------- */
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function themeColor() { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', isDark() ? '#08131D' : '#016FA8'); }
themeColor();

/* ---------- render ---------- */
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(render); };
const isDesk = () => window.matchMedia('(min-width:960px)').matches;
let restoring = false;
function render() {
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  const app = document.getElementById('app');
  const a = document.activeElement, fid = a && a.id;
  // a box being typed in keeps its cursor and selection across the redraw
  const sel = a && a.tagName === 'INPUT' && a.type === 'text' ? [a.selectionStart, a.selectionEnd] : null;
  const ps = document.querySelector('.pscroll'); const pst = ps ? ps.scrollTop : 0;
  const board = S.present && !!T;
  document.documentElement.classList.toggle('presenting', board);
  if (board) {
    app.innerHTML = vBoard();
    document.getElementById('shade').classList.remove('on');
    document.documentElement.classList.remove('lock');
  } else {
    const body = S.tab === 'book' ? vBook() : S.tab === 'tournament' ? vTour() : S.tab === 'rates' ? vRates() : vInfo();
    const panelOpen = !!S.pick;
    app.innerHTML = topbar() + '<div class="layout' + (S.tab === 'book' ? '' : ' one') + '"><main class="main">' + body + '</main>'
      + (S.tab === 'book' ? '<aside class="panel' + (panelOpen ? ' open' : '') + (panelOpen && !S.sent ? ' has-foot' : '') + '" id="panel" aria-label="Your booking"' + (!panelOpen && !isDesk() ? ' aria-hidden="true"' : '') + '>' + vPanel() + '</aside>' : '') + '</div>' + tabbar();
    document.getElementById('shade').classList.toggle('on', panelOpen && S.tab === 'book' && !isDesk());
    document.documentElement.classList.toggle('lock', panelOpen && S.tab === 'book' && !isDesk());
    const nps = document.querySelector('.pscroll'); if (nps && S.keepScroll) nps.scrollTop = pst; S.keepScroll = true;
  }
  if (fid) {
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement) {
      restoring = true;
      try { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ }
      restoring = false;
    }
  }
  fitPanel();
}
/* on desktop the docked panel always ends inside the window, so its total and button stay visible */
function fitPanel() {
  const p = document.getElementById('panel'); if (!p) return;
  if (!isDesk()) { p.style.maxHeight = ''; return; }
  const top = Math.max(16, p.getBoundingClientRect().top);
  p.style.maxHeight = Math.max(360, window.innerHeight - top - 16) + 'px';
}
let fitRaf = 0;
window.addEventListener('scroll', () => { if (!fitRaf) fitRaf = requestAnimationFrame(() => { fitRaf = 0; fitPanel(); }); }, { passive: true });

function pick(s) {
  S.pick = { s }; S.keepScroll = false;
  S.sent = false; S.copied = null;
  const max = maxHours(s);
  if (!S.hours || S.hours > max) S.hours = Math.min(2, max);
  if (S.hours < 1) S.hours = 1;
}
function close() { S.pick = null; S.sent = false; S.copied = null; schedule(); }
function copyMsg() {
  const text = messageText();
  try {
    navigator.clipboard.writeText(text).then(() => { S.copied = true; schedule(); }, () => { S.copied = false; selectMsg(); schedule(); });
  } catch (e) { S.copied = false; schedule(); }
}
function selectMsg() { setTimeout(() => { const box = document.getElementById('msgbox'); if (!box) return; const r = document.createRange(); r.selectNodeContents(box); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }, 60); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') { e.preventDefault(); S.tab = el.dataset.v; S.pick = null; S.sent = false; try { history.replaceState(null, '', '#' + S.tab); } catch (err) { /* ignore */ } window.scrollTo(0, 0); schedule(); return; }
  if (act === 'today') { S.day = startsFor(TODAY).length || TODAY + 1 >= W0 + 7 * WEEKS ? TODAY : TODAY + 1; S.week = Math.floor((mondayOf(S.day) - W0) / 7); S.pick = null; schedule(); return; }
  if (act === 'week') { const w = Math.max(0, Math.min(WEEKS - 1, S.week + Number(el.dataset.v))); if (w !== S.week) { S.week = w; const ws = W0 + 7 * w; S.day = Math.max(ws, TODAY); S.pick = null; schedule(); } return; }
  if (act === 'day') { S.day = Number(el.dataset.dn); S.pick = null; schedule(); return; }
  if (act === 'pick') { pick(Number(el.dataset.s)); schedule(); return; }
  if (act === 'len') { S.hours = Math.max(1, Math.min(maxHours(S.pick.s), Number(el.dataset.v))); schedule(); return; }
  if (act === 'late') { S.late = !S.late; schedule(); return; }
  if (act === 'step') {
    const k = el.dataset.k, d = Number(el.dataset.v);
    if (k === 'hours') S.hours = Math.max(1, Math.min(maxHours(S.pick.s), S.hours + d));
    if (k === 'paddles') S.paddles = Math.max(0, Math.min(8, S.paddles + d));
    if (k === 'balls') S.balls = Math.max(0, Math.min(4, S.balls + d));
    schedule(); return;
  }
  if (act === 'hours') { S.hours = Math.min(maxHours(S.pick.s), S.hours + Number(el.dataset.v)); schedule(); return; }
  if (act === 'sport') { S.sport = el.dataset.v; schedule(); return; }
  if (act === 'racquets') { S.racquets = el.checked; schedule(); return; }
  if (act === 'send') { el.href = messengerUrl(); copyMsg(); S.sent = true; setTimeout(schedule, 80); return; }
  if (act === 'copy') { copyMsg(); return; }
  if (act === 'open-msgr') { el.href = messengerUrl(); return; }
  if (act === 'reset') { S.sent = false; S.copied = null; S.pick = null; schedule(); return; }
  if (act === 'tsub') { S.tsub = el.dataset.v; try { history.replaceState(null, '', S.tsub === 'standings' ? '#standings' : '#tournament'); } catch (err) { /* ignore */ } schedule(); return; }
  if (act === 'present') { enterPresent(); return; }
  if (act === 'unpresent') { exitPresent(); return; }
  if (act === 'pedit') { S.pedit = !S.pedit; schedule(); return; }
  if (act === 'bcat') { S.bcat = Number(el.dataset.v); schedule(); return; }
  if (act === 'scopy') { copyScores(); return; }
  if (act === 'sclear') {
    if (S.clearArm && Date.now() - S.clearArm < 5000) { LIVE = {}; saveLive(); S.clearArm = 0; }
    else { S.clearArm = Date.now(); setTimeout(schedule, 5100); }
    schedule(); return;
  }
  if (act === 'soff') { S.scorer = false; try { localStorage.removeItem(SKEY); } catch (err) { /* ignore */ } if (S.present) exitPresent(); else schedule(); return; }
  if (act === 'tday') { S.tday = Number(el.dataset.v); schedule(); return; }
  if (act === 'reg') { const c = tCat(el.dataset.cat); if (c) { try { navigator.clipboard.writeText(regText(c)).catch(() => {}); } catch (err) { /* ignore */ } } return; }
  if (act === 'close') { close(); return; }
  if (act === 'theme') { const n = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('abri-theme', n); } catch (err) { /* ignore */ } themeColor(); schedule(); return; }
});
const isScore = el => !!el && !!el.classList && el.classList.contains('si');
document.addEventListener('input', e => {
  const el = e.target;
  if (isScore(el)) { setScore(el); return; }
  if (el.dataset.bind !== 'name') return;
  S.name = el.value.slice(0, 60);
  try { localStorage.setItem('ak-name', S.name); } catch (err) { /* storage unavailable */ }
  const cta = document.getElementById('cta'); if (cta) cta.href = messengerUrl();
});
// the standings redraw once a score box is left (Enter, Tab or a click elsewhere)
document.addEventListener('change', e => { if (isScore(e.target)) schedule(); });
// clicking into a score box selects its number, so typing replaces it
let selBox = null;
document.addEventListener('focusin', e => { const el = e.target; if (restoring || !isScore(el)) return; selBox = el; try { el.select(); } catch (err) { /* ignore */ } });
document.addEventListener('mouseup', e => { if (selBox && e.target === selBox) e.preventDefault(); selBox = null; });
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && isScore(el)) {
    e.preventDefault();
    const all = [...document.querySelectorAll('input.si')], nx = all[all.indexOf(el) + 1];
    if (nx) nx.focus(); else el.blur();
    render();
    // on the board, the last box of a stage hands over to the first empty box of what is up next
    if (!nx && S.present) { const f = [...document.querySelectorAll('.bd-next input.si')].find(i => !i.value); if (f) f.focus(); }
    return;
  }
  if (e.key !== 'Escape') return;
  if (S.pedit) { S.pedit = false; schedule(); return; }
  if (S.present) { exitPresent(); return; }
  if (S.pick) close();
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.present && S.fs) exitPresent(); });
['mousemove', 'keydown', 'touchstart'].forEach(k => document.addEventListener(k, wake, { passive: true }));
// another window of this browser changed the scores (a second window on the projector, say): redraw with them
window.addEventListener('storage', e => {
  if (e.key === LKEY) { loadLive(); if (!isScore(document.activeElement)) schedule(); }
  else if (e.key === SKEY) { S.scorer = e.newValue === '1'; schedule(); }
});
window.addEventListener('hashchange', () => {
  const t = location.hash.slice(1);
  if (T && (t === 'standings' || t === 'present')) { S.tab = 'tournament'; S.tsub = 'standings'; S.pick = null; if (t === 'present') S.present = true; schedule(); return; }
  if (TABS.includes(t) && t !== S.tab) { S.tab = t; S.pick = null; schedule(); }
});
window.addEventListener('resize', () => schedule());

/* swipe the week strip to change weeks */
let tx = null, ty = null;
document.addEventListener('touchstart', e => { if (!e.target.closest('#strip')) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const w = Math.max(0, Math.min(WEEKS - 1, S.week + (dx < 0 ? 1 : -1)));
  if (w !== S.week) { S.week = w; S.day = Math.max(W0 + 7 * w, TODAY); S.pick = null; schedule(); }
}, { passive: true });

/* the schedule rolls forward on its own: re-check the clock every minute */
setInterval(() => { if (!S.pick && !isScore(document.activeElement)) schedule(); }, 60000);
render();
if (S.present) wake();
})();
</script>
</body>
</html>
